<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inter Arcade Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/LauncherInternado/LauncherInternship/Launcher/styles.css" rel="stylesheet">
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
/>

<style>
  :root {
    --header-bg: #3E4559;
    --bar-bg: #018445;
    --bg-top: #3E4559;
    --bg-bottom: #12151c;
    --card-w: 179px;
    --card-h: 245px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "Pixelify Sans", sans-serif;
    background: transparent;
    /* background: #12151c; */
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ============================================================
     PAGE BACKGROUND (poster-style, behind everything)
     ============================================================ */

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: url("assets/images/launcher/bg_interbayamon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* ============================================================
     HEADER
     ============================================================ */

  header.top-bar {
    height: 80px;
    background-color: var(--header-bg);
    display: flex;
    align-items: center;
    padding: 5px 15px;
    flex-shrink: 0;
  }

  .header-row {
    display: flex;
    align-items: center;
    width: 100%;
  }

  .logo {
    max-width: 220px;
    max-height: 65px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .logo-fallback {
    width: 220px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: #9aa1b5;
    font-size: 14px;
  }

  .title {
    flex: 1;
    text-align: center;
    color: white;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .header-spacer {
    width: 220px;
    flex-shrink: 0;
  }

  /* ============================================================
     TIGER STRIP
     ============================================================ */

  /* .tiger-area {
    position: absolute;
    right: 20px;
    top: 80px;
    width: 180px;
    height: 135px;
    z-index: 5;
    pointer-events: none;
  } */

  .tiger-area {
    height: 1px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0 10px 0 10px;
    z-index: 1;
  }

  .tiger-area img {
    max-width: 180px;
    max-height: 135px;
    object-fit: contain;
  }

  /* ============================================================
     GREEN BAR
     ============================================================ */

  .status-bar {
    height: 42px;
    background-color: var(--bar-bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status-bar span {
    color: white;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }

  /* ============================================================
     GAME AREA (noisy gradient + flow layout)
     ============================================================ */

  .game-area {
    flex: 1;
    position: relative;
    overflow-y: auto;
    background-image: url("assets/images/launcher/pixel_bg.png");
    background-repeat: repeat;
    background-position: top left;
    background-size: 128px 128px;
    /* Keep the source pixels crisp instead of letting the browser
       smooth/blur them when tiled at native size. */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  .game-grid {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 25px;
  }

  /* ============================================================
     GAME CARD
     ============================================================ */

  .game-card {
    width: var(--card-w);
    height: var(--card-h);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .game-card:hover {
    transform: translateY(-8px);
    /* border-color: rgba(255, 255, 255, 0.5);
    border: 5px solid rgba(255, 255, 255, 0.5); */
    border-color: rgb(255, 187, 0);
    border: 5px solid rgb(255, 187, 0);
  }

  .game-card:active {
    transform: translateY(-1px);
  }

  .game-card img {
    width: 139px;
    height: 205px;
    object-fit: contain;
    pointer-events: none;
  }

  .game-card .no-poster {
    color: #cfd3e0;
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }

  /* ============================================================
     CAROUSEL CARD
     ============================================================ */

  .game-slider {
    width: 100%;
    padding: 25px 0 30px;
    overflow: hidden;
    box-sizing: border-box;
    z-index: 20;
  }

  .game-slider .swiper-slide {
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
  }

  .carousel-game-card {
    width: 189px;
    height: 255px;
    background: rgba(255, 255, 255, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    transition:
      transform 0.15s ease,
      border-color 0.15s ease;
    box-sizing: border-box;
  }

  .carousel-game-card:hover {
    transform: translateY(-8px);
    border-color: rgb(255, 187, 0);
    border: 5px solid rgb(255, 187, 0);
  }

  .carousel-game-card img {
    width: 159px;
    height: 225px;
    object-fit: contain;
    pointer-events: none;
  }

  /* Swiper navigation buttons */

  .game-slider .swiper-button-prev,
  .game-slider .swiper-button-next {
    color: white;
    width: 40px;
    height: 40px;
  }

  .game-slider .swiper-button-prev::after,
  .game-slider .swiper-button-next::after {
    font-size: 28px;
  }

  .game-slider .swiper-pagination {
    bottom: 0;
  }

  .game-slider .swiper-pagination-bullet {
    background: white;
    opacity: 0.5;
  }

  .game-slider .swiper-pagination-bullet-active {
    opacity: 1;
  }

  /* ============================================================
     LAUNCH TOAST (browser stand-in for subprocess.Popen)
     ============================================================ */

  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translate(-50%, 20px);
    background: #1c2030;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 10;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>

<body>

<div class="page-bg" id="pageBg"></div>

<div id="app">

  <!-- HEADER -->
  <header class="top-bar">
    <div class="header-row">
      <img class="logo" id="logoImg" src="assets/images/launcher/name_interbayamon.png" alt=""
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div class="logo-fallback" id="logoFallback" style="display:none;">INTERBAYAMÓN</div>
      <div class="title">Inter Arcade Games</div>
      <div class="header-spacer"></div>
    </div>
  </header>

  <!-- POSTER CAROUSEL -->
  <div class="game-slider swiper" id="gameSlider">
    <div class="swiper-wrapper" id="sliderWrapper"></div>

  </div>

  <!-- TIGER -->
  <div class="tiger-area">
    <img id="tigerImg" src="assets/images/launcher/tiger_interbayamon.png" alt=""
         onerror="this.style.display='none';">
  </div>

  <!-- GREEN BAR -->
  <div class="status-bar">
    <span>Game on!</span>
  </div>

  <!-- GAME AREA -->
  <div class="game-area">
    <div class="game-grid" id="gameGrid"></div>
  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */

// Set this to a real image URL to show behind the whole page,
// mirroring bg_interbayamon.png in the original app. Use a path like
// "assets/images/launcher/bg_interbayamon.png" (no leading "../") for
// the same reason the posters/logo don't use it — see launcher_server.py.
// document.getElementById('pageBg').style.setProperty('--bg-image', 'none');

/* ============================================================
   GAMES DATA
   In the Python app this came from games.json on disk:
   [{ "name": ..., "poster": ..., "exe": ... }, ...]
   In the browser we can't launch a local .exe, so "exe" is kept
   as metadata and launch_game() below shows a toast instead.
   Replace this array with your real game list, or fetch it:
     fetch('games.json').then(r => r.json()).then(renderGames)
   ============================================================ */

const GAMES = [
  { name: "Locked In Area 51",  poster: "assets/images/posters/locked_in_area_51.png",   exe: "../../ArcadeGames/LockedInArea51/TigerGameJam.exe" },
  { name: "Memories of Ladein", poster: "assets/images/posters/memories_of_ladein.png",   exe: "../../ArcadeGames/MemoriesOfLadein/MemoriesOfLadien_v1.1.3/Project_Fallen_Angel.exe" },
  { name: "Project Emergency",  poster: "assets/images/posters/project_emergency.png",    exe: "../../ArcadeGames/MasterWorkforceProject/Windows/ProyectoEmergencia.exe" },
  { name: "Vanishing Stars",    poster: "assets/images/posters/vanishing_stars.png",      exe: "../../ArcadeGames/VanishingStars/Windows/Vanishing Stars.exe" },
];

/* ============================================================
   POSTER CARD SLIDER
   ============================================================ */

let gameSwiper = null;

function renderCarousel(games) {
  const wrapper = document.getElementById('sliderWrapper');

  wrapper.innerHTML = '';

  games.forEach((game) => {
    const slide = document.createElement('div');
    slide.className = 'swiper-slide';

    slide.innerHTML = `
      <div class="carousel-game-card">
        <img src="${game.poster}" alt="${game.name}">
      </div>
    `;

    slide.addEventListener('click', () => launchGame(game));

    wrapper.appendChild(slide);
  });

  // Destroy old Swiper instance
  if (gameSwiper) {
    gameSwiper.destroy(true, true);
    gameSwiper = null;
  }

  // Give the browser one frame to lay out the slides
  requestAnimationFrame(() => {

    gameSwiper = new Swiper('#gameSlider', {
      slidesPerView: 3,
      spaceBetween: 5,

      centeredSlides: false,

      loop: true,

      speed: 500,

      grabCursor: true,

      autoplay: {
        delay: 2100,
        disableOnInteraction: false,
        pauseOnMouseEnter: true
      },

      breakpoints: {
        0: {
          slidesPerView: 1,
          spaceBetween: 5
        },

        600: {
          slidesPerView: 2,
          spaceBetween: 5
        },

        900: {
          slidesPerView: 3,
          spaceBetween: 5
        },

        1400: {
          slidesPerView: 3,
          spaceBetween: 5
        }
      }
    });

    // Force Swiper to recalculate its dimensions
    gameSwiper.update();
  });
}

/* ============================================================
   GAME CARDS  (flexbox = flow layout, wraps + centers rows
   automatically, replacing the custom FlowLayout class)
   ============================================================ */

   
function renderGames(games) {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';

  games.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.title = game.name;

    const img = new Image();
    img.alt = game.name;
    img.src = game.poster;
    img.onerror = () => {
      card.innerHTML = `<div class="no-poster">No Poster<br>${game.name}</div>`;
    };

    card.appendChild(img);
    card.addEventListener('click', () => launchGame(game));

    grid.appendChild(card);
  });
}

/* ============================================================
   LAUNCH GAME
   A browser can't spawn a local .exe on its own, so this page
   is meant to be opened FROM launcher_server.py (run it and it
   opens this page for you). That server exposes POST /launch,
   which does the real subprocess.Popen on your machine, exactly
   like GameCard.launch_game() did in the Qt app.
   If this page was opened directly as a file:// (no server),
   the fetch below will fail and we tell you so.
   ============================================================ */

function launchGame(game) {
  showToast(`Launching "${game.name}"...`);

  fetch('/launch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ exe: game.exe }),
  })
    .then(res => res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` })))
    .then(data => {
      if (data.ok) {
        showToast(`Launched "${game.name}"`);
      } else {
        showToast(`Could not launch "${game.name}": ${data.error || 'unknown error'}`);
      }
    })
    .catch(() => {
      showToast(`Could not reach launcher_server.py — run it and open this page from there.`);
    });
}

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ============================================================
   INIT
   ============================================================

   The canvas is redrawn any time its actual on-screen size
   changes — not just on window resize. A ResizeObserver on the
   .game-area container catches every cause of that: window
   resizing, the Pixelify Sans web font swapping in after load
   (which can reflow the header and change .game-area's height),
   scrollbars appearing/disappearing, or the page being embedded
   in a panel that resizes without the browser window itself
   resizing. Relying on window's "resize" event alone misses all
   of those, which is why the canvas could end up drawn at a
   stale (too-small) size that never got refreshed.
   ============================================================ */

window.addEventListener('load', () => {
  renderCarousel(GAMES);
  renderGames(GAMES);

  const gameArea = document.querySelector('.game-area');
  let resizeTimer = null;

  const ro = new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refreshNoiseBackground, 50);
  });

  ro.observe(gameArea);

  // Draw once immediately too, in case layout is already stable.
  refreshNoiseBackground();

  // To load games from a real games.json instead of the sample
  // array above, uncomment:
  // fetch('games.json').then(r => r.json()).then(renderGames).catch(() => renderGames(GAMES));
});


</script>

</body>
</html>
