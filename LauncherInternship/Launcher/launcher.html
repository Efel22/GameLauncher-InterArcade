<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inter Arcade Games</title>
    <link href="/Launcher/css/_generic.css" rel="stylesheet">
    <link href="/Launcher/css/_variables.css" rel="stylesheet">
    <link href="/Launcher/css/header.css" rel="stylesheet">
    <link href="/Launcher/css/footer.css" rel="stylesheet">
    <link href="/Launcher/css/carousel/_area-track.css" rel="stylesheet">
    <link href="/Launcher/css/carousel/buttons.css" rel="stylesheet">
    <link href="/Launcher/css/carousel/indicators-dots.css" rel="stylesheet">
    <link href="/Launcher/css/carousel/game-card-and-cartidge.css" rel="stylesheet">
    <link href="/Launcher/css/carousel/game-data.css" rel="stylesheet">
    <link href="/Launcher/css/carousel/browse-instructions.css" rel="stylesheet">
    <link href="/Launcher/css/launch_game_toast.css" rel="stylesheet">
    <link href="/Launcher/css/responsive-adjustments.css" rel="stylesheet">
  </head>
  <style>
        /* ============================================================
      FLYING CARTRIDGE
      ============================================================ */

    .flying-cartridge {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      transform-origin: center center;
      transition:
        left 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.9s ease,
        height 0.9s ease,
        transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }


    /* ============================================================
      LOADING SCREEN
      ============================================================ */

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.88);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition: opacity 0.35s ease;
    }

    #loading-screen.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .loading-box {
      width: min(500px, 85%);
      padding: 35px;

      text-align: center;

      background: var(--green-deep);
      border: 5px solid var(--gold);
      border-radius: 12px;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.5);
    }

    .loading-title {
      color: white;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .loading-cartridge {
      width: 110px;
      height: 145px;
      margin: 0 auto 20px;
    }

    .loading-cartridge img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4));
    }

    .loading-text {
      color: white;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .loading-bar {
      width: 100%;
      height: 20px;
      background: #102719;
      border: 3px solid white;
      border-radius: 4px;
      overflow: hidden;
    }

    #loading-progress {
      width: 0%;
      height: 100%;
      background: var(--gold);
      transition: width 0.15s linear;
    }
  </style>
  <body>
    <div id="app">
      <!-- HEADER -->

      <header class="top-bar">
        <!-- Image lockup -->

        <div class="brand" id="brandImage">
          <img
            class="brand-logo-img"
            src="assets/images/launcher/name_interbayamon.png"
            alt="Inter Bayamón"
            onerror="
              document
                .getElementById('app')
                .classList.add('logo-fallback-active')
            "
          />
        </div>

        <!-- Text lockup -->

        <div class="brand" id="brandText">
          <span class="brand-inter">INTER</span>

          <span class="brand-bayamon">BAYAMÓN</span>
        </div>

        <div class="title">Inter Arcade Games</div>

        <div class="header-icons">
          <img
            class="tiger-icon"
            src="assets/images/launcher/tiger_interbayamon.png"
            alt=""
            onerror="this.style.display = 'none'"
          />
        </div>
      </header>

      <!-- GAME AREA -->

      <div class="game-area">
        <div class="carousel">
          <!-- LEFT ARROW -->

          <button
            class="carousel-btn left"
            id="prevButton"
            aria-label="Previous game"
          >
            ←
          </button>

          <!-- GAME TRACK -->

          <div class="game-track" id="gameGrid"></div>

          <!-- RIGHT ARROW -->

          <button
            class="carousel-btn right"
            id="nextButton"
            aria-label="Next game"
          >
            →
          </button>

          <!-- DOT INDICATORS -->

          <div class="carousel-indicators" id="carouselIndicators"></div>
        </div>
      </div>

      <!-- CONTROL HINT -->
      <div class="carousel-hint">
        Use ← → to browse • Click the center game to play
      </div>

      <!-- FOOTER STRIP -->

      <div class="footer-strip">
      </div>

      <!-- CARTRIDGE SLOT -->
      <div id="cartridge-slot">
        <div class="slot-top"></div>
        <div class="slot-opening"></div>
        <div class="slot-bottom"></div>
      </div>

      <!-- LOADING SCREEN -->
      <div id="loading-screen">
        <div class="loading-box">
          <div class="loading-title">INSERTING GAME...</div>
          
          <div class="loading-cartridge">
            <img src="assets/images/launcher/stylized_game_cartridge.png" alt="">
          </div>

          <div class="loading-text" id="loading-text">
            Loading...
          </div>

          <div class="loading-bar">
            <div id="loading-progress"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast"></div>
    
    <!-- <Script/> must be placed here, else it won't work!  -->
    <script src="/Launcher/launcher_scripts.js"></script>
  </body>
</html>
