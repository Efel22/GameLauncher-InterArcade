<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inter Arcade Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --header-bg: #3E4559;
    --bar-bg: #018445;
    --bg-top: #3E4559;
    --bg-bottom: #12151c;
    --card-w: 179px;
    --card-h: 245px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "Pixelify Sans", sans-serif;
    background: transparent;
    /* background: #12151c; */
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ============================================================
     PAGE BACKGROUND (poster-style, behind everything)
     ============================================================ */

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: url("assets/images/launcher/bg_interbayamon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* ============================================================
     HEADER
     ============================================================ */

  header.top-bar {
    height: 80px;
    background-color: var(--header-bg);
    display: flex;
    align-items: center;
    padding: 5px 15px;
    flex-shrink: 0;
  }

  .header-row {
    display: flex;
    align-items: center;
    width: 100%;
  }

  .logo {
    max-width: 220px;
    max-height: 65px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .logo-fallback {
    width: 220px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: #9aa1b5;
    font-size: 14px;
  }

  .title {
    flex: 1;
    text-align: center;
    color: white;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .header-spacer {
    width: 220px;
    flex-shrink: 0;
  }

  /* ============================================================
     TIGER STRIP
     ============================================================ */

  /* .tiger-area {
    position: absolute;
    right: 20px;
    top: 80px;
    width: 180px;
    height: 135px;
    z-index: 5;
    pointer-events: none;
  } */

  .tiger-area {
    height: 1px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0 20px 0 10px;
  }



  .tiger-area img {
    max-width: 180px;
    max-height: 135px;
    object-fit: contain;
  }

  

  /* ============================================================
     GREEN BAR
     ============================================================ */

  .status-bar {
    height: 42px;
    background-color: var(--bar-bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status-bar span {
    color: white;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }

  /* ============================================================
     GAME AREA (noisy gradient + flow layout)
     ============================================================ */

  .game-area {
    flex: 1;
    position: relative;
    overflow-y: auto;
  }

  .game-area canvas.noise-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  .game-grid {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 25px;
  }

  /* ============================================================
     GAME CARD
     ============================================================ */

  .game-card {
    width: var(--card-w);
    height: var(--card-h);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .game-card:active {
    transform: translateY(-1px);
  }

  .game-card img {
    width: 139px;
    height: 205px;
    object-fit: contain;
    pointer-events: none;
  }

  .game-card .no-poster {
    color: #cfd3e0;
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }

  /* ============================================================
     LAUNCH TOAST (browser stand-in for subprocess.Popen)
     ============================================================ */

  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translate(-50%, 20px);
    background: #1c2030;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 10;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>

<div class="page-bg" id="pageBg"></div>

<div id="app">

  <!-- HEADER -->
  <header class="top-bar">
    <div class="header-row">
      <img class="logo" id="logoImg" src="assets/images/launcher/name_interbayamon.png" alt=""
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
      <div class="logo-fallback" id="logoFallback" style="display:none;">INTERBAYAMÓN</div>
      <div class="title">Inter Arcade Games</div>
      <div class="header-spacer"></div>
    </div>
  </header>

  

  <!-- POSTER CAROUSEL -->
  <div id="gameCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner" id="carouselInner"></div>
  </div>

  <!-- TIGER -->
  <div class="tiger-area">
    <img id="tigerImg" src="assets/images/launcher/tiger_interbayamon.png" alt=""
         onerror="this.style.display='none';">
  </div>

  <!-- GREEN BAR -->
  <div class="status-bar">
    <span>Game on!</span>
  </div>

  <!-- GAME AREA -->
  <div class="game-area">
    <canvas class="noise-bg" id="noiseCanvas"></canvas>
    <div class="game-grid" id="gameGrid"></div>
  </div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */

// Set this to a real image URL to show behind the whole page,
// mirroring bg_interbayamon.png in the original app. Use a path like
// "assets/images/launcher/bg_interbayamon.png" (no leading "../") for
// the same reason the posters/logo don't use it — see launcher_server.py.
// document.getElementById('pageBg').style.setProperty('--bg-image', 'none');

/* ============================================================
   GAMES DATA
   In the Python app this came from games.json on disk:
   [{ "name": ..., "poster": ..., "exe": ... }, ...]
   In the browser we can't launch a local .exe, so "exe" is kept
   as metadata and launch_game() below shows a toast instead.
   Replace this array with your real game list, or fetch it:
     fetch('games.json').then(r => r.json()).then(renderGames)
   ============================================================ */

const GAMES = [
  { name: "Locked In Area 51",  poster: "assets/images/posters/locked_in_area_51.png",   exe: "../../ArcadeGames/LockedInArea51/TigerGameJam.exe" },
  { name: "Memories of Ladein", poster: "assets/images/posters/memories_of_ladein.png",   exe: "../../ArcadeGames/MemoriesOfLadein/MemoriesOfLadien_v1.1.3/Project_Fallen_Angel.exe" },
  { name: "Project Emergency",  poster: "assets/images/posters/project_emergency.png",    exe: "../../ArcadeGames/MasterWorkforceProject/Windows/ProyectoEmergencia.exe" },
  { name: "Vanishing Stars",    poster: "assets/images/posters/vanishing_stars.png",      exe: "../../ArcadeGames/VanishingStars/Windows/Vanishing Stars.exe" },
];

/* ============================================================
   NOISY GRADIENT BACKGROUND
   Port of GradientBackground.paintEvent(): a low-res pixel grid,
   colored by a top-to-bottom gradient plus random per-pixel and
   per-cluster noise, then scaled back up without smoothing.
   ============================================================ */

function drawNoiseBackground(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();

  const width = Math.max(1, Math.round(rect.width));
  const height = Math.max(1, Math.round(rect.height));

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  const ctx = canvas.getContext('2d');

  const pixelSize = 10;
  const smallWidth = Math.max(1, Math.floor(width / pixelSize));
  const smallHeight = Math.max(1, Math.floor(height / pixelSize));

  // Deterministic PRNG (seed 12345) so the pattern is stable, like
  // random.seed(12345) in the original.
  let seed = 12345;
  function rand() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return seed / 0x7fffffff;
  }
  function randInt(min, max) {
    return Math.floor(rand() * (max - min + 1)) + min;
  }

  const small = document.createElement('canvas');
  small.width = smallWidth;
  small.height = smallHeight;
  const sctx = small.getContext('2d');
  const imgData = sctx.createImageData(smallWidth, smallHeight);

  const original = { r: 0x3E, g: 0x45, b: 0x59 };
  const dark = { r: 18, g: 21, b: 28 };

  function setPixel(x, y, r, g, b) {
    const idx = (y * smallWidth + x) * 4;
    imgData.data[idx] = r;
    imgData.data[idx + 1] = g;
    imgData.data[idx + 2] = b;
    imgData.data[idx + 3] = 255;
  }

  function getPixel(x, y) {
    const idx = (y * smallWidth + x) * 4;
    return {
      r: imgData.data[idx],
      g: imgData.data[idx + 1],
      b: imgData.data[idx + 2],
    };
  }

  for (let y = 0; y < smallHeight; y++) {
    const progress = smallHeight > 1 ? y / (smallHeight - 1) : 0;
    const t = Math.pow(progress, 1.4);

    const baseR = Math.round(original.r * (1 - t) + dark.r * t);
    const baseG = Math.round(original.g * (1 - t) + dark.g * t);
    const baseB = Math.round(original.b * (1 - t) + dark.b * t);

    for (let x = 0; x < smallWidth; x++) {
      const variation = randInt(-7, 7);

      const r = Math.max(0, Math.min(255, baseR + variation));
      const g = Math.max(0, Math.min(255, baseG + variation));
      const b = Math.max(0, Math.min(255, baseB + variation));

      setPixel(x, y, r, g, b);
    }
  }

  // Larger irregular pixel clusters
  const clusterCount = Math.floor(smallWidth * smallHeight * 0.025);

  for (let i = 0; i < clusterCount; i++) {
    const x = randInt(0, smallWidth - 1);
    const y = randInt(0, smallHeight - 1);
    const clusterSize = randInt(1, 4);
    const brightness = randInt(-12, 12);

    for (let cy = 0; cy < clusterSize; cy++) {
      for (let cx = 0; cx < clusterSize; cx++) {
        const px = x + cx;
        const py = y + cy;

        if (px < smallWidth && py < smallHeight) {
          const current = getPixel(px, py);

          const r = Math.max(0, Math.min(255, current.r + brightness));
          const g = Math.max(0, Math.min(255, current.g + brightness));
          const b = Math.max(0, Math.min(255, current.b + brightness));

          setPixel(px, py, r, g, b);
        }
      }
    }
  }

  sctx.putImageData(imgData, 0, 0);

  // Scale the pixel-art pattern back up without smoothing.
  ctx.imageSmoothingEnabled = false;
  ctx.scale(dpr, dpr);
  ctx.drawImage(small, 0, 0, smallWidth, smallHeight, 0, 0, width, height);
}

function refreshNoiseBackground() {
  const canvas = document.getElementById('noiseCanvas');
  drawNoiseBackground(canvas);
}

window.addEventListener('resize', () => {
  clearTimeout(window.__noiseResizeTimer);
  window.__noiseResizeTimer = setTimeout(refreshNoiseBackground, 120);
});

/* ============================================================
   BOOTSTRAP POSTER CAROUSEL
   ============================================================ */

function renderCarousel(games) {
  const carousel = document.getElementById('carouselInner');

  carousel.innerHTML = '';

  games.forEach((game, index) => {
    const item = document.createElement('div');

    item.className = `carousel-item${index === 0 ? ' active' : ''}`;

    item.innerHTML = `
      <div class="d-flex justify-content-center align-items-center"
           style="height: 290px;">
        <img src="${game.poster}"
             alt="${game.name}"
             style="height: 250px; width: 205px; object-fit: contain;">
      </div>
    `;

    carousel.appendChild(item);
  });
}

/* ============================================================
   GAME CARDS  (flexbox = flow layout, wraps + centers rows
   automatically, replacing the custom FlowLayout class)
   ============================================================ */

   
function renderGames(games) {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';

  games.forEach(game => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.title = game.name;

    const img = new Image();
    img.alt = game.name;
    img.src = game.poster;
    img.onerror = () => {
      card.innerHTML = `<div class="no-poster">No Poster<br>${game.name}</div>`;
    };

    card.appendChild(img);
    card.addEventListener('click', () => launchGame(game));

    grid.appendChild(card);
  });
}

/* ============================================================
   LAUNCH GAME
   A browser can't spawn a local .exe on its own, so this page
   is meant to be opened FROM launcher_server.py (run it and it
   opens this page for you). That server exposes POST /launch,
   which does the real subprocess.Popen on your machine, exactly
   like GameCard.launch_game() did in the Qt app.
   If this page was opened directly as a file:// (no server),
   the fetch below will fail and we tell you so.
   ============================================================ */

function launchGame(game) {
  showToast(`Launching "${game.name}"...`);

  fetch('/launch', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ exe: game.exe }),
  })
    .then(res => res.json().catch(() => ({ ok: false, error: `HTTP ${res.status}` })))
    .then(data => {
      if (data.ok) {
        showToast(`Launched "${game.name}"`);
      } else {
        showToast(`Could not launch "${game.name}": ${data.error || 'unknown error'}`);
      }
    })
    .catch(() => {
      showToast(`Could not reach launcher_server.py — run it and open this page from there.`);
    });
}

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ============================================================
   INIT
   ============================================================ */

window.addEventListener('load', () => {
  refreshNoiseBackground();
  renderCarousel(GAMES);
  renderGames(GAMES);

  // To load games from a real games.json instead of the sample
  // array above, uncomment:
  // fetch('games.json').then(r => r.json()).then(renderGames).catch(() => renderGames(GAMES));
});


</script>

</body>
</html>
